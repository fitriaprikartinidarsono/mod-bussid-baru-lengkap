name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get list of changed files
        id: changed-files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt
          cat changed_files.txt

      - name: Purge jsDelivr cache for changed files
        run: |
          REPO="fitriaprikartinidarsono/mod-bussid-baru-lengkap"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              encoded_path=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              url="https://purge.jsdelivr.net/gh/${REPO}@main/${encoded_path}"
              echo "Purging: $url"
              curl -s -X GET "$url"
              echo ""
            fi
          done < changed_files.txt
